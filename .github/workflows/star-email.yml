name: Star email notification

on:
  watch:
    types: [started]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send notification through QQ Mail
        env:
          MAIL_ACCOUNT: ${{ secrets.STAR_MAIL_ACCOUNT }}
          MAIL_AUTH_CODE: ${{ secrets.STAR_MAIL_AUTH_CODE }}
        shell: python
        run: |
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          account = os.environ.get("MAIL_ACCOUNT", "").strip()
          auth_code = os.environ.get("MAIL_AUTH_CODE", "").strip()
          if not account or not auth_code:
              raise SystemExit("Configure STAR_MAIL_ACCOUNT and STAR_MAIL_AUTH_CODE in repository Actions secrets.")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          repository = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          repository_url = f"{server_url}/{repository}"
          run_url = f"{repository_url}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          is_test = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"

          if is_test:
              subject = f"[GitHub Star] 测试邮件：{repository}"
              body = f"Star 邮件通知已配置成功。\n项目：{repository}\n{repository_url}\n\n运行记录：{run_url}\n\n这是一封测试邮件，不代表新增 Star。"
          else:
              actor = event["sender"]["login"]
              count = event["repository"].get("stargazers_count")
              subject = f"[GitHub Star] {repository} 收到来自 {actor} 的 Star"
              body = f"你的项目收到一个新 Star。\n项目：{repository}\n用户：{actor}\n用户主页：{server_url}/{actor}\n项目链接：{repository_url}\n"
              if count is not None:
                  body += f"事件记录中的 Star 总数：{count}\n"
              body += f"\n运行记录：{run_url}\n"

          message = EmailMessage()
          message["From"] = account
          message["To"] = account
          message["Subject"] = subject
          message.set_content(body)
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ssl.create_default_context(), timeout=30) as smtp:
              smtp.login(account, auth_code)
              smtp.send_message(message)
          print("Notification sent.")
